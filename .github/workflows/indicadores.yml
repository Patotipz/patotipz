name: Actualizar indicadores

on:
  schedule:
    - cron: "40 19 * * 1-5"   # lunes a viernes, 1:40 pm hora de Ciudad de México
  workflow_dispatch:           # también se puede correr a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  indicadores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar indicadores de Banxico
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
        run: python scripts/fetch_indicators.py
      - name: Guardar cambios
        run: |
          git config user.name "patotipz-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/indicators.json
          git diff --staged --quiet || (git commit -m "Actualizar indicadores" && git pull --rebase origin main && git push)
