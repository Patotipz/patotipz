name: Actualizar noticias

on:
  schedule:
    - cron: "17 */3 * * *"   # cada 3 horas
  workflow_dispatch:           # también se puede correr a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar titulares
        run: python scripts/fetch_news.py
      - name: Guardar cambios
        run: |
          git config user.name "patotipz-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json
          git diff --staged --quiet || (git commit -m "Actualizar noticias" && git push)
